podSecurityPolicy:
  enabled: true

server:
  persistentVolume:
    enabled: false
  resources:
    limits:
      cpu: "200m"
      memory: "50Mi"
    requests:
      cpu: "100m"
      memory: "30Mi"
  retention: 15d
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: gp3
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi


grafana:
  enabled: true
  adminUser: admin
  adminPassword: "ChangeMe123!" 
  service:
    type: LoadBalancer
  ingress:
    enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
