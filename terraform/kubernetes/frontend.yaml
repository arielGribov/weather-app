apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 205930636266.dkr.ecr.us-east-1.amazonaws.com/weather-repo-frontend-app:20250817-ad37a73
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://backend:8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
